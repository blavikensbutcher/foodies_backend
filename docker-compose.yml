services:
  db:
    image: postgres:16-alpine
    container_name: foodies_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodies}
      POSTGRES_DB: ${POSTGRES_DB:-foodies}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - foodies_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodies} -d ${POSTGRES_DB:-foodies}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  foodies_postgres_data:
